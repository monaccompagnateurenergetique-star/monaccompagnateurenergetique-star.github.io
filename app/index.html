<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d6b4f">
<meta name="description" content="Lire, remplir, signer et transformer vos PDF, directement sur votre téléphone. Rien n'est envoyé sur internet.">
<title>Atelier PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* =========================================================
   1. STYLES DE BASE
   ========================================================= */
:root{
  --fond:#f3f2ee; --carte:#ffffff; --encre:#1b2130; --doux:#5d6576; --ligne:#e1ded6;
  --accent:#0d6b4f; --accent-fort:#0a5540; --accent-pale:#e2f0ea; --danger:#b42318;
  --rayon:14px; --ombre:0 1px 2px rgba(20,24,35,.06),0 4px 14px rgba(20,24,35,.06);
  --haut-sur:env(safe-area-inset-top,0px); --bas-sur:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--encre);background:var(--fond);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid #2b7cff;outline-offset:2px}
[hidden]{display:none!important}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ecran{position:fixed;inset:0;display:none;flex-direction:column;background:var(--fond)}
.ecran.actif{display:flex}

/* Boutons */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ligne);background:var(--carte);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--encre)}
.btn:active{background:#f0eee8}
.btn.principal{background:var(--accent);border-color:transparent;color:#fff}
.btn.principal:active{background:var(--accent-fort)}
.btn.danger{color:var(--danger)}
.btn.large{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn-icone{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:none;border-radius:12px;padding:0}
.btn-icone:active{background:rgba(0,0,0,.06)}

/* =========================================================
   2. ACCUEIL
   ========================================================= */
.barre-accueil{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--haut-sur)) 12px 8px 16px}
.marque{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.marque svg{width:34px;height:34px}
.accueil{flex:1;overflow:auto;padding:4px 16px calc(24px + var(--bas-sur));max-width:720px;width:100%;margin:0 auto}
.carte-ouvrir{width:100%;display:flex;align-items:center;gap:16px;padding:20px;border:0;border-radius:18px;background:var(--accent);color:#fff;text-align:left;box-shadow:var(--ombre)}
.carte-ouvrir:active{background:var(--accent-fort)}
.carte-ouvrir .ico{width:34px;height:34px}
.carte-ouvrir strong{display:block;font-size:20px}
.carte-ouvrir span{opacity:.85;font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.carte-mini,.tuile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:1px solid var(--ligne);border-radius:var(--rayon);background:var(--carte);text-align:left;min-height:44px}
.carte-mini:active,.tuile:active{background:#f7f6f2}
.carte-mini .ico,.tuile .ico{color:var(--accent);width:26px;height:26px;margin-bottom:4px}
.carte-mini strong,.tuile strong{font-size:15px}
.carte-mini span,.tuile span{font-size:13px;color:var(--doux);line-height:1.3}
.titre-section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);margin:24px 2px 10px}
.grille-outils{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.confiance{display:flex;gap:10px;align-items:flex-start;margin-top:24px;padding:14px;border-radius:var(--rayon);background:var(--accent-pale);font-size:14px;color:#244a3c}
.confiance .ico{color:var(--accent)}
@media (min-width:640px){.grille-outils{grid-template-columns:repeat(3,1fr)}}

/* =========================================================
   3. LECTEUR / ÉDITEUR
   ========================================================= */
.barre-doc{display:flex;align-items:center;gap:2px;padding:calc(6px + var(--haut-sur)) 4px 6px;background:var(--carte);border-bottom:1px solid var(--ligne);z-index:5}
.barre-doc h1{flex:1;min-width:0;margin:0 4px;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barre-recherche{display:flex;align-items:center;gap:2px;padding:6px 4px 6px 10px;background:var(--carte);border-bottom:1px solid var(--ligne)}
#barre-recherche input{flex:1;min-width:0;height:44px;border:1px solid var(--ligne);border-radius:10px;padding:0 12px;background:#faf9f6}
#q-compte{font-size:13px;color:var(--doux);min-width:48px;text-align:center}
#aide-placement{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:#fff8e1;border-bottom:1px solid #f0e2b0;font-size:14px}
#aide-placement span{flex:1}
#defil{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;background:#d9d7d0;-webkit-overflow-scrolling:touch}
#pages{position:relative;padding:8px 8px 96px;transform-origin:0 0;width:max-content;min-width:100%}
.page{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.page canvas.rendu{position:absolute;inset:0;width:100%;height:100%;display:block}
.calque-recherche,.calque-items{position:absolute;inset:0;pointer-events:none}
.calque-items{z-index:3}
.surligne{position:absolute;background:rgba(255,196,0,.45);border-radius:2px;mix-blend-mode:multiply}
.surligne.actuel{background:rgba(255,110,0,.55);box-shadow:0 0 0 2px rgba(255,110,0,.6)}
.indic-page{position:absolute;left:12px;bottom:calc(84px + var(--bas-sur));z-index:4;min-height:36px;padding:0 12px;border-radius:18px;border:0;background:rgba(27,33,48,.78);color:#fff;font-size:14px}
.barre-bas{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + var(--bas-sur));background:var(--carte);border-top:1px solid var(--ligne);z-index:5}
.barre-bas .btn.principal{flex:1}
.outil{min-width:64px;height:56px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:12px;font-size:12px;font-weight:600;color:var(--encre)}
.outil:active,.outil.actif{background:var(--accent-pale);color:var(--accent-fort)}
.outils-edition{overflow-x:auto;gap:2px;padding-left:4px;padding-right:4px}
.outils-edition .outil{flex:1 1 0;min-width:46px;padding:4px 1px;font-size:11px;letter-spacing:-.01em}
.outils-edition .outil.terminer{color:#fff;background:var(--accent);margin-left:2px;flex-basis:auto;padding:4px 8px}
#ecran-doc.mode-lire #barre-editer,#ecran-doc.mode-editer #barre-lire{display:none}

/* Éléments posés sur les pages */
.item{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.mode-lire .item{pointer-events:none}
.item-texte{white-space:pre;line-height:1.15;font-family:Helvetica,Arial,sans-serif;min-width:8px;min-height:1em}
.item-image img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.mode-editer .item{outline:1px dashed rgba(13,107,79,.35);outline-offset:1px}
.item.sel{outline:2px dashed var(--accent)!important;outline-offset:2px}
.poignee,.suppr{display:none;position:absolute;padding:0;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.poignee{right:-16px;bottom:-16px;width:28px;height:28px;background:var(--accent);touch-action:none}
.poignee::before,.suppr::before{content:"";position:absolute;inset:-9px}
.suppr{top:-20px;right:-20px;width:34px;height:34px;background:var(--danger);color:#fff;display:none;place-items:center}
.suppr .ico{width:16px;height:16px;stroke-width:3}
.mode-editer .item.sel .poignee{display:block}
.mode-editer .item.sel .suppr{display:grid}
#pages.placement .calque-items{pointer-events:auto;cursor:crosshair}
#pages.placement .item{pointer-events:none}

/* Couche des champs de formulaire (pdf.js) */
.annotationLayer{position:absolute;top:0;left:0;pointer-events:none;transform-origin:0 0;z-index:2}
.annotationLayer[data-main-rotation="90"]{transform:rotate(90deg) translateX(-100%)}
.annotationLayer[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
.annotationLayer[data-main-rotation="270"]{transform:rotate(270deg) translateY(-100%)}
.annotationLayer section{position:absolute;text-align:initial;pointer-events:auto;box-sizing:border-box;transform-origin:0 0}
.annotationLayer .linkAnnotation>a{position:absolute;inset:0}
.annotationLayer :is(.textWidgetAnnotation :is(input,textarea),.choiceWidgetAnnotation select){background:rgba(0,84,255,.10);border:1px solid rgba(0,84,255,.25);border-radius:2px;box-sizing:border-box;font:calc(9px * var(--scale-factor)) Helvetica,Arial,sans-serif;height:100%;width:100%;margin:0;padding:0 2px;vertical-align:top;color:#000}
.annotationLayer .textWidgetAnnotation textarea{resize:none}
.annotationLayer :is(.textWidgetAnnotation :is(input,textarea),.choiceWidgetAnnotation select):focus{background:rgba(0,84,255,.04);border-color:#2b7cff;outline:none}
.annotationLayer .textWidgetAnnotation input.comb{font-family:monospace;padding-left:2px;padding-right:0}
.annotationLayer .buttonWidgetAnnotation:is(.checkBox,.radioButton) input{appearance:none;-webkit-appearance:none;width:100%;height:100%;margin:0;background:rgba(0,84,255,.10);border:1px solid rgba(0,84,255,.35);display:block}
.annotationLayer .buttonWidgetAnnotation.radioButton input{border-radius:50%}
.annotationLayer .buttonWidgetAnnotation:is(.checkBox,.radioButton) input:checked{background:#1b2130 content-box;padding:18%;border-color:#1b2130}
.annotationLayer .buttonWidgetAnnotation:not(.checkBox):not(.radioButton) input{display:none}
.annotationLayer .popupAnnotation,.annotationLayer .popupTriggerArea{display:none}

/* =========================================================
   4. FEUILLES (fenêtres qui montent du bas)
   ========================================================= */
.voile{position:fixed;inset:0;background:rgba(15,18,28,.45);opacity:0;transition:opacity .2s}
.voile.ouvert{opacity:1}
.feuille{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;max-width:640px;margin:0 auto;background:var(--carte);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out;box-shadow:0 -4px 24px rgba(0,0,0,.15)}
.feuille.ouverte{transform:none}
.feuille.pleine{top:0;max-height:none;border-radius:0}
.feuille-tete{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--haut-sur)) 6px 6px 18px;border-bottom:1px solid var(--ligne)}
.feuille:not(.pleine) .feuille-tete{padding-top:10px}
.feuille-tete h2{flex:1;margin:0;font-size:17px}
.feuille-corps{flex:1;overflow:auto;padding:16px 18px}
.feuille-pied{display:flex;gap:10px;padding:10px 16px calc(10px + var(--bas-sur));border-top:1px solid var(--ligne)}
.feuille-pied .btn{flex:1}
@media (prefers-reduced-motion:reduce){.feuille,.voile{transition:none}}

/* Formulaires internes */
.champ{display:block;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--ligne);border-radius:10px;background:#faf9f6}
textarea.champ{resize:vertical}
.etiquette{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.etiquette:first-child{margin-top:0}
.note{font-size:13px;color:var(--doux);margin:8px 0}
.segments{display:flex;flex-wrap:wrap;gap:6px}
.segments label{position:relative}
.segments input{position:absolute;opacity:0;pointer-events:none}
.segments span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--ligne);border-radius:22px;background:#fff;font-size:14px;font-weight:600}
.segments input:checked+span{border-color:var(--accent);background:var(--accent-pale);color:var(--accent-fort)}
.segments input:focus-visible+span{outline:3px solid #2b7cff}
.pastille{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.liste{list-style:none;margin:0;padding:0}
.ligne{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ligne)}
.ligne .texte{flex:1;min-width:0}
.ligne .texte strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ligne .texte small{color:var(--doux)}
.menu-liste button{width:100%;display:flex;align-items:center;gap:14px;min-height:52px;padding:0 6px;border:0;background:none;text-align:left;font-size:16px;border-radius:10px}
.menu-liste button:active{background:#f3f2ee}
.menu-liste .ico{color:var(--accent)}
.damier{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.grille-tampons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.carte-tampon{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--ligne);border-radius:12px;background:#fff;text-align:left}
.carte-tampon .apercu{height:80px;border-radius:8px;display:grid;place-items:center;overflow:hidden}
.carte-tampon img{max-width:100%;max-height:72px}
.carte-tampon .nom{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte-tampon .actions{display:flex;gap:4px}
.carte-tampon .actions .btn{flex:1;min-height:40px;padding:0 6px;font-size:13px}
.vide{padding:18px;border:1px dashed var(--ligne);border-radius:12px;text-align:center;color:var(--doux);font-size:14px}
.rangee-btn{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rangee-btn .btn{flex:1 1 140px}
.pad{width:100%;height:240px;border:1px solid var(--ligne);border-radius:12px;touch-action:none;display:block;background:#fff}
.zone-apercu{display:grid;place-items:center;min-height:160px;border-radius:12px;border:1px solid var(--ligne);overflow:hidden;padding:8px}
.zone-apercu canvas{max-width:100%;max-height:44dvh}
.vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.vignette{position:relative;border:2px solid transparent;border-radius:10px;padding:4px;background:#fff;box-shadow:var(--ombre);text-align:center;min-height:44px}
.vignette.choisie{border-color:var(--accent);background:var(--accent-pale)}
.vignette .cadre{height:130px;display:grid;place-items:center;overflow:hidden}
.vignette canvas,.vignette img{max-width:100%;max-height:126px;box-shadow:0 0 0 1px #ddd;transition:transform .15s}
.vignette .num{font-size:12px;font-weight:600;color:var(--doux)}
.vignette .coche{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.vignette.choisie .coche{display:grid}
.vignette .coche .ico{width:14px;height:14px;stroke-width:3}
.barre-actions{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;border-top:1px solid var(--ligne);background:#faf9f6}
.barre-actions .outil{flex:1 0 auto}
.scan-zone{position:relative;touch-action:none;margin:0 auto;user-select:none}
.scan-zone canvas{display:block;width:100%;height:100%;border-radius:6px}
.coin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(13,107,79,.25);border:3px solid var(--accent);touch-action:none}
.coin::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--accent)}

/* Messages et attente */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--bas-sur));transform:translate(-50%,20px);max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:#1b2130;color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10000;text-align:center}
#toast.visible{opacity:1;transform:translate(-50%,0)}
#occupe{position:fixed;inset:0;display:none;place-items:center;background:rgba(243,242,238,.75);z-index:9999}
#occupe.visible{display:grid}
#occupe .boite{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 24px;border-radius:16px;background:#fff;box-shadow:var(--ombre);font-weight:600}
.roue{width:34px;height:34px;border:4px solid var(--accent-pale);border-top-color:var(--accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roue{animation-duration:2.4s}}
#depot{position:fixed;inset:0;display:none;place-items:center;background:rgba(13,107,79,.12);border:4px dashed var(--accent);z-index:9998;font-size:20px;font-weight:700;color:var(--accent-fort)}
#depot.visible{display:grid}
</style>
</head>

  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M20 15l-4.5-4.5L6 20"/></symbol>
  <symbol id="i-fusion" viewBox="0 0 24 24"><rect x="3" y="3" width="9" height="12" rx="1.5"/><rect x="12" y="9" width="9" height="12" rx="1.5"/></symbol>
  <symbol id="i-pages" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-compresser" viewBox="0 0 24 24"><path d="M12 3v6M9 6l3 3 3-3"/><path d="M12 21v-6M9 18l3-3 3 3"/><path d="M4 12h16"/></symbol>

<script>
'use strict';
/* =========================================================
   0. RÉGLAGES GÉNÉRAUX ET OUTILS
   ========================================================= */
const VERSION_APPLI = '1.0.0';
const pdfjsLib = window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
const { PDFDocument, StandardFonts, rgb, degrees } = window.PDFLib;
const MODE_FORMS = pdfjsLib.AnnotationMode.ENABLE_FORMS;
const MODE_STOCK = pdfjsLib.AnnotationMode.ENABLE_STORAGE;
const CLE_TAMPONS = 'atelierpdf.stamps.v1';
const CLE_PREFS = 'atelierpdf.prefs.v1';
const A4 = [595.28, 841.89];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const attendre = ms => new Promise(r => setTimeout(r, ms));
const idUnique = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/** Crée un élément HTML : el('button', {class:'btn', onclick: f}, 'Texte') */
function el(tag, props = {}, ...enfants) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (typeof v !== 'string' && k in e) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of enfants.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
function icone(nom) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ico'); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#i-' + nom); s.append(u); return s;
}
function bouton(texte, { ico, cls = 'btn', onclick, label } = {}) {
  return el('button', { type: 'button', class: cls, onclick, 'aria-label': label }, ico ? icone(ico) : null, texte);
}

let minuteurToast;
function toast(msg, ms = 3400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('visible');
  clearTimeout(minuteurToast); minuteurToast = setTimeout(() => t.classList.remove('visible'), ms);
}
let niveauOccupe = 0;
function occupe(msg = 'Un instant…') { niveauOccupe++; $('#occupe-texte').textContent = msg; $('#occupe').classList.add('visible'); }
function majOccupe(msg) { $('#occupe-texte').textContent = msg; }
function libre() { niveauOccupe = Math.max(0, niveauOccupe - 1); if (!niveauOccupe) $('#occupe').classList.remove('visible'); }

function tailleLisible(n) {
  if (n < 1024) return n + ' o';
  if (n < 1048576) return (n / 1024).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' Ko';
  return (n / 1048576).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' Mo';
}
const nomSansExt = n => String(n || 'document').replace(/\.[a-z0-9]{1,5}$/i, '');
const nomSortie = (nom, suffixe = 'modifié', ext = 'pdf') => `${nomSansExt(nom)} (${suffixe}).${ext}`;
const estPdf = f => f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || ''));
const estImage = f => f && (/^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|heic)$/i.test(f.name || ''));
async function lireFichier(f) { return { nom: f.name || 'document.pdf', octets: new Uint8Array(await f.arrayBuffer()) }; }

/** Transforme un texte pour qu'il soit écrit avec la police standard du PDF (accents français compris). */
const WINANSI_EXTRA = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
function versWinAnsi(s) {
  return Array.from(String(s ?? '').normalize('NFC').replace(/\r/g, '').replace(/[     \t]/g, ' '), c => {
    const k = c.codePointAt(0);
    if (c === '\n' || (k >= 32 && k <= 126) || (k >= 160 && k <= 255) || WINANSI_EXTRA.includes(c)) return c;
    const base = c.normalize('NFD').replace(/[̀-ͯ]/g, '');
    return base.length === 1 && base.charCodeAt(0) < 127 ? base : '?';
  }).join('');
}
function hexVersRgb(h) {
  const n = parseInt(String(h).replace('#', ''), 16) || 0;
  return rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
function dataUrlVersOctets(d) {
  const b = atob(d.split(',')[1]); const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function canvasVersBlob(c, type = 'image/jpeg', q = 0.85) { return new Promise(r => c.toBlob(r, type, q)); }

/* =========================================================
   1. DONNÉES ENREGISTRÉES (localStorage uniquement)
   ========================================================= */
const PREFS_DEFAUT = { tailleTexte: 11, couleurTexte: '#111111', largeurSignature: 140, largeurTampon: 130, formatPhotos: 'a4', compression: 'moyenne' };
function lirePrefs() { try { return { ...PREFS_DEFAUT, ...JSON.parse(localStorage.getItem(CLE_PREFS) || '{}') }; } catch { return { ...PREFS_DEFAUT }; } }
function ecrirePrefs(p) { try { localStorage.setItem(CLE_PREFS, JSON.stringify(p)); } catch { toast('Impossible d\'enregistrer les réglages.'); } }
let prefs = lirePrefs();
function lireTampons() { try { const t = JSON.parse(localStorage.getItem(CLE_TAMPONS) || '[]'); return Array.isArray(t) ? t : []; } catch { return []; } }
function ecrireTampons(liste) {
  try { localStorage.setItem(CLE_TAMPONS, JSON.stringify(liste)); return true; }
  catch { toast('Mémoire pleine : supprimez une signature ou un tampon puis réessayez.', 5000); return false; }
}

/* =========================================================
   2. NAVIGATION (le bouton « retour » d'Android ferme la dernière fenêtre)
   ========================================================= */
const pile = []; const attentesRetour = [];
function ouvrirCouche(fermer) { pile.push(fermer); history.pushState({ couche: pile.length }, ''); }
function fermerCouche() { return new Promise(res => { attentesRetour.push(res); history.back(); }); }
addEventListener('popstate', () => {
  const f = pile.pop(); if (f) f();
  const r = attentesRetour.shift(); if (r) r();
});

let zFeuille = 100;
/** Ouvre une « feuille » (fenêtre qui monte du bas). Renvoie { corps, pied, fermer }. */
function feuille({ titre, plein = false, pied = true, surFermeture }) {
  const corps = el('div', { class: 'feuille-corps' });
  const zonePied = pied ? el('div', { class: 'feuille-pied' }) : null;
  let ferme = false;
  const api = { corps, pied: zonePied, ferme: () => ferme };
  const f = el('div', { class: 'feuille' + (plein ? ' pleine' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': titre },
    el('div', { class: 'feuille-tete' }, el('h2', { text: titre }), bouton('', { ico: 'fermer', cls: 'btn-icone', label: 'Fermer', onclick: () => api.fermer() })),
    corps, zonePied);
  const voile = el('div', { class: 'voile', onclick: () => api.fermer() });
  voile.style.zIndex = ++zFeuille; f.style.zIndex = ++zFeuille;
  document.body.append(voile, f);
  requestAnimationFrame(() => { voile.classList.add('ouvert'); f.classList.add('ouverte'); });
  function retirer() {
    if (ferme) return; ferme = true;
    f.classList.remove('ouverte'); voile.classList.remove('ouvert');
    setTimeout(() => { f.remove(); voile.remove(); }, 230);
    if (surFermeture) surFermeture();
  }
  ouvrirCouche(retirer);
  api.fermer = () => ferme ? Promise.resolve() : fermerCouche();
  return api;
}
/** Petite fenêtre de choix : renvoie la valeur choisie, ou null. */
function demanderChoix(titre, options) {
  return new Promise(res => {
    let choix = null;
    const fe = feuille({ titre, pied: false, surFermeture: () => res(choix) });
    fe.corps.append(el('div', { class: 'menu-liste' }, options.map(o =>
      bouton(o.texte, { ico: o.ico, onclick: () => { choix = o.valeur; fe.fermer(); } }))));
  });
}

/** Ouvre le sélecteur de fichiers du téléphone. */
function choisirFichiers({ accept = 'application/pdf,.pdf', multiple = false, capture } = {}) {
  return new Promise(res => {
    const i = el('input', { type: 'file', accept, style: { display: 'none' } });
    i.multiple = multiple;
    if (capture) i.setAttribute('capture', capture);
    let fini = false;
    const finir = v => { if (fini) return; fini = true; i.remove(); res(v); };
    i.addEventListener('change', () => finir([...i.files]));
    i.addEventListener('cancel', () => finir([]));
    document.body.append(i); i.click();
  });
}

/* =========================================================
   3. ENREGISTRER / PARTAGER
   ========================================================= */
function telecharger(octets, nom, type = 'application/pdf') {
  const url = URL.createObjectURL(new Blob([octets], { type }));
  const a = el('a', { href: url, download: nom, style: { display: 'none' } });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function enregistrer(octets, nom, type = 'application/pdf') {
  const mobile = matchMedia('(pointer: coarse)').matches;
  if (window.showSaveFilePicker && !mobile) {
    try {
      const h = await showSaveFilePicker({ suggestedName: nom, types: [{ description: 'Document', accept: { [type]: ['.' + nom.split('.').pop()] } }] });
      const w = await h.createWritable(); await w.write(new Blob([octets], { type })); await w.close();
      return true;
    } catch (e) { if (e.name === 'AbortError') return false; }
  }
  telecharger(octets, nom, type);
  return true;
}
/** Partage via le menu du téléphone. Si le navigateur refuse (délai dépassé), on propose un bouton. */
async function partager(fichiers) {
  if (!navigator.canShare || !navigator.canShare({ files: fichiers })) {
    toast('Le partage n\'est pas disponible ici : le fichier est enregistré à la place.');
    for (const f of fichiers) { telecharger(new Uint8Array(await f.arrayBuffer()), f.name, f.type); await attendre(300); }
    return;
  }
  try { await navigator.share({ files: fichiers }); }
  catch (e) {
    if (e.name === 'AbortError') return;
    if (e.name === 'NotAllowedError') {
      const fe = feuille({ titre: 'Fichier prêt' });
      fe.corps.append(el('p', { text: 'Votre fichier est prêt. Touchez « Partager » pour l\'envoyer.' }));
      fe.pied.append(bouton('Partager', { ico: 'partager', cls: 'btn principal', onclick: async () => { try { await navigator.share({ files: fichiers }); } catch {} fe.fermer(); } }));
    } else toast('Partage impossible : ' + e.message);
  }
}
const fichierPdf = (octets, nom) => new File([octets], nom, { type: 'application/pdf' });

/** Fenêtre de résultat commune aux outils : Ouvrir / Partager / Enregistrer. */
function feuilleResultat(octets, nom, info) {
  const fe = feuille({ titre: 'C\'est prêt' });
  fe.corps.append(
    el('p', {}, el('strong', { text: nom })),
    el('p', { class: 'note', text: (info ? info + ' · ' : '') + tailleLisible(octets.length) }));
  fe.pied.append(
    bouton('Ouvrir', { ico: 'doc', onclick: async () => { await fe.fermer(); ouvrirPdf(octets, nom); } }),
    bouton('Partager', { ico: 'partager', onclick: () => partager([fichierPdf(octets, nom)]) }),
    bouton('Enregistrer', { ico: 'enregistrer', cls: 'btn principal', onclick: async () => { if (await enregistrer(octets, nom)) toast('Fichier enregistré'); } }));
}

/* =========================================================
   4. OUVERTURE D'UN DOCUMENT
   ========================================================= */
let D = null; // document ouvert
const defil = $('#defil'), pagesEl = $('#pages'), ecranDoc = $('#ecran-doc');

async function chargerPdfjs(octets, { demanderMotDePasse = true } = {}) {
  const tache = pdfjsLib.getDocument({ data: octets.slice(), isEvalSupported: false, enableXfa: false, useSystemFonts: true });
  if (demanderMotDePasse) tache.onPassword = (repondre, raison) => {
    const mdp = prompt(raison === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD ? 'Mot de passe incorrect. Réessayez :' : 'Ce PDF est protégé. Mot de passe :');
    if (mdp === null) tache.destroy(); else repondre(mdp);
  };
  return tache.promise;
}

async function ouvrirFichier(f) {
  if (!estPdf(f)) { toast('Ce fichier n\'est pas un PDF.'); return; }
  const { nom, octets } = await lireFichier(f);
  return ouvrirPdf(octets, nom);
}

async function ouvrirPdf(octets, nom) {
  if (D && D.modifie && !confirm('Le document en cours n\'est pas enregistré. L\'abandonner ?')) return;
  occupe('Ouverture…');
  let pdf;
  try { pdf = await chargerPdfjs(octets); }
  catch (e) {
    libre();
    if (e?.name === 'PasswordException') return;
    toast('Impossible d\'ouvrir ce fichier : il est peut-être abîmé ou n\'est pas un PDF.', 5000);
    console.error(e); return;
  }
  try {
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const vp = p.getViewport({ scale: 1 });
      pages.push({ p, vp, w: vp.width, h: vp.height });
    }
    const champs = (await pdf.getFieldObjects()) || {};
    const ancien = D;
    D = {
      nom, octets, pdf, pages, champs, aDesChamps: Object.keys(champs).length > 0,
      items: [], images: {}, historique: [], modifie: false, mode: 'lire', zoom: 1, s: 1,
      selection: null, attente: null, textes: [], resultats: [], resIndex: -1, vues: []
    };
    if (ancien) ancien.pdf.destroy();

function construireVue() {

    const v = { page, canvas: el('canvas', { class: 'rendu' }), recherche: el('div', { class: 'calque-recherche' }),

function echelleAjustee() {

async function rendrePage(i) {

/* Zoom au pincement (deux doigts) et Ctrl + molette sur ordinateur */
let pince = null;
function appliquerZoom(z, cx, cy) {
  z = clamp(z, 0.5, 5);
  if (!D || Math.abs(z - D.zoom) < 0.01) return;
  const r = defil.getBoundingClientRect();
  const ox = defil.scrollLeft + (cx - r.left), oy = defil.scrollTop + (cy - r.top);
  const ancienne = D.s;
  D.zoom = z; mettreEnPage();
  const k = D.s / ancienne;
  defil.scrollLeft = ox * k - (cx - r.left);
  defil.scrollTop = oy * k - (cy - r.top);
}
defil.addEventListener('touchstart', e => {
  if (!D || e.touches.length !== 2) return;
  const [a, b] = e.touches;
  pince = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2, f: 1 };
  const r = defil.getBoundingClientRect();
  pagesEl.style.transformOrigin = `${defil.scrollLeft + pince.cx - r.left}px ${defil.scrollTop + pince.cy - r.top}px`;
}, { passive: true });
defil.addEventListener('touchmove', e => {

}, { passive: false });
function finPince(e) {

  pagesEl.style.transform = '';

defil.addEventListener('touchend', finPince);
defil.addEventListener('touchcancel', finPince);

const normCar = c => (c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()[0]) || c;
const normaliser = s => Array.from(s, normCar).join('');

  if (!D.textes[i]) D.textes[i] = await D.pages[i].p.getTextContent();

/** Rectangle (en points, origine en haut à gauche) d'un morceau de texte. */
function rectTexte(i, it, debut = 0, long = null) {
  const vp = D.pages[i].vp;
  const len = Math.max(1, it.str.length); if (long == null) long = len - debut;

  const p1 = [tx[4] + ux * L * (debut + long) / len, tx[5] + uy * L * (debut + long) / len];
  const pts = [p0, p1].flatMap(p => [[p[0] + hx * h * 0.9, p[1] + hy * h * 0.9], [p[0] - hx * h * 0.22, p[1] - hy * h * 0.22]]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);

  return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y, taille: h, base: tx[5], angle: a };

async function lancerRecherche(q) {

      if (!it.str) return;
      const s = normaliser(it.str);
      let pos = s.indexOf(nq);
      while (pos >= 0) { D.resultats.push({ page: i, rect: rectTexte(i, it, pos, nq.length) }); pos = s.indexOf(nq, pos + 1); }
    });

  D.vues.forEach((_, i) => dessinerSurlignages(i));

}
function allerResultat(k) {

      style: { left: r.rect.x * D.s + 'px', top: r.rect.y * D.s + 'px', width: r.rect.w * D.s + 'px', height: r.rect.h * D.s + 'px' } }));

function rendreItems(i) {

/* Corriger un texte existant : on le recouvre d'un masque blanc et on réécrit par-dessus */
async function corrigerTexte(i, x, y) {
  const tc = await texteDePage(i);
  let meilleur = null;
  for (const it of tc.items) {
    if (!it.str || !it.str.trim()) continue;
    const r = rectTexte(i, it);
    if (x >= r.x - 2 && x <= r.x + r.w + 2 && y >= r.y - 2 && y <= r.y + r.h + 2) {
      const aire = r.w * r.h;
      if (!meilleur || aire < meilleur.aire) meilleur = { it, r, aire };
    }
  }
  if (!meilleur) { toast('Aucun texte à cet endroit. Touchez directement un mot.'); return; }
  annulerPlacement();
  memoriser();
  const { it: t, r } = meilleur;
  const masque = { id: idUnique(), type: 'masque', page: i, x: r.x - 1, y: r.y - 1, w: r.w + 2, h: r.h + 2, couleur: '#ffffff' };
  const taille = Math.round(r.taille * 10) / 10;
  const texte = { id: idUnique(), type: 'texte', page: i, x: r.x, y: r.base - taille * 0.92, texte: t.str, taille, couleur: '#111111', masqueLie: masque.id };
  if (Math.abs(r.angle) > 0.05) { texte.y = r.y; }
  D.items.push(masque, texte); D.modifie = true;
  rendreItems(i); selectionner(texte.id);
  editerItem(texte);
}

/* =========================================================
   8. EXPORT DU PDF (buildPdf)
   Ordre : remplissage des champs → flatten → écriture (flush) → embedPage → éléments posés.
   ========================================================= */
/** Convertit un point « vu à l'écran » (origine en haut à gauche) en point PDF, selon la rotation de la page. */
function versUtilisateur(cb, R, vx, vy) {
  switch (R) {
    case 90: return [cb.x + vy, cb.y + vx];
    case 180: return [cb.x + cb.width - vx, cb.y + vy];
    case 270: return [cb.x + cb.width - vy, cb.y + cb.height - vx];
    default: return [cb.x + vx, cb.y + cb.height - vy];
  }
}
const angleDe = page => (((page.getRotation().angle || 0) % 360) + 360) % 360;

async function remplirChamps(doc) {
  const stock = D.pdf.annotationStorage;
  if (!stock.size) return 0;
  const form = doc.getForm();
  let n = 0;
  for (const [nom, objets] of Object.entries(D.champs)) {
    const valeurs = objets.map(o => ({ o, v: o.id ? stock.getValue(o.id, {}) : {} })).filter(x => 'value' in x.v);
    if (!valeurs.length) continue;
    let champ; try { champ = form.getField(nom); } catch { continue; }
    const type = objets[0].type;
    try {
      if (type === 'text') {
        let t = versWinAnsi(valeurs[valeurs.length - 1].v.value ?? '');
        const max = champ.getMaxLength?.(); if (max) t = t.slice(0, max);
        champ.setText(t);
      } else if (type === 'checkbox') {
        valeurs.some(x => x.v.value === true || (typeof x.v.value === 'string' && x.v.value !== 'Off')) ? champ.check() : champ.uncheck();
      } else if (type === 'radiobutton') {
        const choisi = valeurs.find(x => x.v.value === true);
        if (choisi) {
          const options = champ.getOptions();
          const ev = choisi.o.exportValues;
          const opt = options.includes(ev) ? ev : options[objets.indexOf(choisi.o)];
          if (opt != null) champ.select(opt);
        }
      } else if (type === 'combobox' || type === 'listbox') {
        const v = valeurs[valeurs.length - 1].v.value;
        const liste = (Array.isArray(v) ? v : [v]).filter(x => x != null && x !== '').map(versWinAnsi);
        if (liste.length) champ.select(type === 'listbox' ? liste : liste[0]); else champ.clear?.();
      } else continue;
      n++;
    } catch (e) { console.warn('Champ non rempli :', nom, e); }
  }
  return n;
}

async function dessinerItems(out, np, items, versPdf, R, ressources) {
  for (const it of items) {
    const rot = degrees(R);
    if (it.type === 'masque') {
      const [x, y] = versPdf(it.x, it.y + it.h);
      np.drawRectangle({ x, y, width: it.w, height: it.h, color: hexVersRgb(it.couleur), rotate: rot, borderWidth: 0 });
    } else if (it.type === 'image') {
      let img = ressources.images.get(it.img);
      if (!img) {
        const src = D.images[it.img];
        img = src.startsWith('data:image/png') ? await out.embedPng(dataUrlVersOctets(src)) : await out.embedJpg(dataUrlVersOctets(src));
        ressources.images.set(it.img, img);
      }
      const [x, y] = versPdf(it.x, it.y + it.h);
      np.drawImage(img, { x, y, width: it.w, height: it.h, rotate: rot });
    } else if (it.type === 'texte') {
      if (!ressources.police) ressources.police = await out.embedFont(StandardFonts.Helvetica);
      versWinAnsi(it.texte).split('\n').forEach((ligne, k) => {
        if (!ligne) return;
        const [x, y] = versPdf(it.x, it.y + it.taille * (0.92 + 1.15 * k));
        np.drawText(ligne, { x, y, size: it.taille, font: ressources.police, color: hexVersRgb(it.couleur), rotate: rot });
      });
    }
  }
}

async function construirePdf() {
  if (document.activeElement && pagesEl.contains(document.activeElement)) document.activeElement.blur();
  await attendre(30);
  let src;
  try { src = await PDFDocument.load(D.octets, { ignoreEncryption: true, updateMetadata: false }); }
  catch (e) { console.warn('pdf-lib ne lit pas ce fichier, export en images', e); return construirePdfImage(); }
  if (src.isEncrypted) { toast('PDF protégé : il sera enregistré sous forme d\'images.', 4500); return construirePdfImage(); }

  // 1. Remplissage des champs du formulaire, puis « flatten » (les champs deviennent du texte fixe)
  await remplirChamps(src);
  const form = src.getForm();
  if (form.getFields().length) {
    try { form.flatten({ updateFieldAppearances: true }); }
    catch (e) { console.warn('flatten avec apparences impossible, nouvel essai', e); try { form.flatten({ updateFieldAppearances: false }); } catch (e2) { console.warn(e2); } }
  }
  // 2. « flush » : on écrit le document pour figer les apparences, puis on le relit
  src = await PDFDocument.load(await src.save({ updateFieldAppearances: false, useObjectStreams: false }), { ignoreEncryption: true, updateMetadata: false });

  // 3. Nouveau document : chaque page est intégrée (embedPage), puis on dessine les éléments posés
  const out = await PDFDocument.create();
  out.setProducer('Atelier PDF'); out.setCreator('Atelier PDF'); out.setTitle(nomSansExt(D.nom));
  const ressources = { images: new Map(), police: null };
  const pagesSrc = src.getPages();
  for (let i = 0; i < pagesSrc.length; i++) {
    const sp = pagesSrc[i], mb = sp.getMediaBox(), cb = sp.getCropBox(), R = angleDe(sp);
    const np = out.addPage([mb.width, mb.height]);
    np.setMediaBox(mb.x, mb.y, mb.width, mb.height);
    np.setCropBox(cb.x, cb.y, cb.width, cb.height);
    try {
      const emb = await out.embedPage(sp, { left: mb.x, bottom: mb.y, right: mb.x + mb.width, top: mb.y + mb.height });
      np.drawPage(emb, { x: mb.x, y: mb.y });
    } catch (e) { console.warn('Page vide ou illisible', i + 1, e); }
    np.setRotation(degrees(R));
    await dessinerItems(out, np, D.items.filter(t => t.page === i), (x, y) => versUtilisateur(cb, R, x, y), R, ressources);
  }
  return out.save();
}

/** Rend une page en image JPEG (sert à la compression, aux images, à l'aplatissement). */
async function pageEnImage(page, dpi = 150, qualite = 0.8, type = 'image/jpeg') {
  let s = dpi / 72;
  const vp1 = page.getViewport({ scale: 1 });
  const maxPix = 16e6; if (vp1.width * vp1.height * s * s > maxPix) s = Math.sqrt(maxPix / (vp1.width * vp1.height));
  const vp = page.getViewport({ scale: s });
  const c = el('canvas'); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp, annotationMode: MODE_STOCK }).promise;
  const blob = await canvasVersBlob(c, type, qualite);
  c.width = c.height = 0;
  return { octets: new Uint8Array(await blob.arrayBuffer()), w: vp1.width, h: vp1.height };
}
/** Export « aplati » : chaque page devient une image, puis on dessine les éléments posés. */
async function construirePdfImage(dpi = 150) {
  const out = await PDFDocument.create(); out.setProducer('Atelier PDF');
  const ressources = { images: new Map(), police: null };
  for (let i = 0; i < D.pages.length; i++) {
    majOccupe(`Page ${i + 1} / ${D.pages.length}…`);
    const img = await pageEnImage(D.pages[i].p, dpi, 0.82);
    const jpg = await out.embedJpg(img.octets);
    const np = out.addPage([img.w, img.h]);
    np.drawImage(jpg, { x: 0, y: 0, width: img.w, height: img.h });
    await dessinerItems(out, np, D.items.filter(t => t.page === i), (x, y) => [x, img.h - y], 0, ressources);
  }
  return out.save();
}
const documentModifie = () => D.items.length > 0 || D.pdf.annotationStorage.size > 0;

/* =========================================================
   9. SIGNATURES ET TAMPONS (dessin, photo détourée, tampon texte)
   ========================================================= */
function rogner(c, marge = 6) {
  const ctx = c.getContext('2d'), { width: w, height: h } = c;
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  x0 = Math.max(0, x0 - marge); y0 = Math.max(0, y0 - marge); x1 = Math.min(w - 1, x1 + marge); y1 = Math.min(h - 1, y1 + marge);
  const r = el('canvas'); r.width = x1 - x0 + 1; r.height = y1 - y0 + 1;
  r.getContext('2d').drawImage(c, x0, y0, r.width, r.height, 0, 0, r.width, r.height);
  return r;
}
function reduire(c, max = 1000) {
  const k = Math.min(1, max / Math.max(c.width, c.height));
  if (k === 1) return c;
  const r = el('canvas'); r.width = Math.round(c.width * k); r.height = Math.round(c.height * k);
  const ctx = r.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(c, 0, 0, r.width, r.height);
  return r;
}
function sauverTampon(c, type, nom) {
  const r = reduire(c, 1000);
  const t = { id: idUnique(), nom: nom || (type === 'signature' ? 'Signature' : 'Tampon'), type, png: r.toDataURL('image/png'), l: r.width, h: r.height, cree: Date.now() };
  const liste = lireTampons(); liste.push(t);
  return ecrireTampons(liste) ? t : null;
}
const libelleType = type => type === 'signature' ? 'signature' : 'tampon';

/** Dessiner au doigt */
function dessinerTampon(type) {
  return new Promise(res => {
    let resultat = null;
    const fe = feuille({ titre: type === 'signature' ? 'Dessiner une signature' : 'Dessiner un tampon', plein: true, surFermeture: () => res(resultat) });
    let couleur = '#111111', epaisseur = 3;
    const pad = el('canvas', { class: 'pad', 'aria-label': 'Zone de dessin' });
    const nom = el('input', { class: 'champ', id: 'nom-dessin', value: type === 'signature' ? 'Ma signature' : 'Mon tampon', maxlength: 40 });
    fe.corps.append(
      el('p', { class: 'note', text: 'Signez dans le cadre avec le doigt. Tournez le téléphone en paysage pour plus de place.' }), pad,
      el('div', { class: 'etiquette', text: 'Couleur de l\'encre' }),
      segments('encre', [['#111111', 'Noir', '#111111'], ['#1d3fb3', 'Bleu', '#1d3fb3']], couleur, c => { couleur = c; }),
      el('div', { class: 'etiquette', text: 'Épaisseur' }),
      segments('epaisseur', [['2', 'Fine'], ['3', 'Moyenne'], ['5', 'Épaisse']], '3', v => { epaisseur = +v; }),
      el('label', { class: 'etiquette', for: 'nom-dessin', text: 'Nom' }), nom);
    let traits = [], courant = null, k = 1;
    const ctx = pad.getContext('2d');
    const dimensionner = () => {
      k = Math.min(devicePixelRatio || 1, 3);
      pad.width = pad.clientWidth * k; pad.height = pad.clientHeight * k;
      redessiner();
    };
    function tracer(t) {
      ctx.strokeStyle = t.c; ctx.lineWidth = t.e * k; ctx.lineCap = ctx.lineJoin = 'round';
      const p = t.pts; if (!p.length) return;
      ctx.beginPath(); ctx.moveTo(p[0][0] * k, p[0][1] * k);
      if (p.length === 1) ctx.lineTo(p[0][0] * k + 0.1, p[0][1] * k);
      for (let i = 1; i < p.length - 1; i++) {
        const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
        ctx.quadraticCurveTo(p[i][0] * k, p[i][1] * k, mx * k, my * k);
      }
      if (p.length > 1) ctx.lineTo(p[p.length - 1][0] * k, p[p.length - 1][1] * k);
      ctx.stroke();
    }
    function redessiner() { ctx.clearRect(0, 0, pad.width, pad.height); traits.forEach(tracer); }
    const pos = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); courant = { c: couleur, e: epaisseur, pts: [pos(e)] }; traits.push(courant); redessiner(); });
    pad.addEventListener('pointermove', e => { if (!courant) return; const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach(x => courant.pts.push(pos(x))); redessiner(); });
    const fin = () => { courant = null; };
    pad.addEventListener('pointerup', fin); pad.addEventListener('pointercancel', fin);
    fe.pied.append(
      bouton('Effacer', { ico: 'poubelle', onclick: () => { traits = []; redessiner(); } }),
      bouton('Enregistrer', { ico: 'valider', cls: 'btn principal', onclick: () => {
        if (!traits.length) { toast('Dessinez d\'abord dans le cadre.'); return; }

/** Chargement d'une photo dans un canvas (taille limitée pour la mémoire du téléphone). */
async function chargerImage(fichier, max = 2400) {
  const url = URL.createObjectURL(fichier);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = el('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
/** Seuil automatique (méthode d'Otsu) pour séparer l'encre du papier. */
function seuilAuto(lum) {
  const hist = new Array(256).fill(0); lum.forEach(v => hist[v]++);
  const total = lum.length; let somme = 0; for (let i = 0; i < 256; i++) somme += i * hist[i];
  let sB = 0, wB = 0, max = 0, seuil = 160;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue; const wF = total - wB; if (!wF) break;
    sB += t * hist[t]; const mB = sB / wB, mF = (somme - sB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > max) { max = v; seuil = t; }
  }
  return seuil;
}
function luminances(c) {
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const l = new Uint8Array(c.width * c.height);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) l[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
  return l;
}
/** Retire le fond clair d'une photo de signature / tampon. */
function detourer(src, seuil, encre) {
  const c = el('canvas'); c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
  const im = ctx.getImageData(0, 0, c.width, c.height), d = im.data;
  const fixe = encre === 'noir' ? [17, 17, 17] : encre === 'bleu' ? [29, 63, 179] : null;
  for (let i = 0; i < d.length; i += 4) {
    const L = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;
    const a = clamp((seuil - L) / 34 + 0.5, 0, 1);
    if (fixe) { d[i] = fixe[0]; d[i + 1] = fixe[1]; d[i + 2] = fixe[2]; }
    else { const k = 0.85; d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; }
    d[i + 3] = Math.round(a * 255);
  }
  ctx.putImageData(im, 0, 0);
  return rogner(c, 4);
}

function tamponTexte() {
  return new Promise(res => {
    let resultat = null, couleur = '#1d3fb3', cadre = 'oui';

      if (cadre === 'oui') { ctx.lineWidth = 6; const r = 14; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(3, 3, c.width - 6, c.height - 6, r) : ctx.rect(3, 3, c.width - 6, c.height - 6); ctx.stroke(); }
      courant = c; zone.replaceChildren(c);

async function lancerOutil(outil, fichiers) {
  if (!fichiers) {
    const choisis = await choisirFichiers({ multiple: outil === 'fusion' });
    if (!choisis.length) return;
    const pdfs = choisis.filter(estPdf);
    if (!pdfs.length) { toast('Choisissez un fichier PDF.'); return; }
    fichiers = await Promise.all(pdfs.map(lireFichier));
  }
  const f = fichiers[0];
  try {
    if (outil === 'fusion') return outilFusion(fichiers);
    if (outil === 'organiser') return await outilOrganiser(f);
    if (outil === 'compresser') return outilCompresser(f);
    if (outil === 'numeros') return outilNumeros(f);
    if (outil === 'filigrane') return outilFiligrane(f);
    if (outil === 'images') return await outilImages(f);
  } catch (e) { console.error(e); toast('Erreur : ' + e.message, 5000); }
}
async function chargerPdfLib(octets) {
  const d = await PDFDocument.load(octets, { ignoreEncryption: true });
  if (d.isEncrypted) throw new Error('ce PDF est protégé par un mot de passe et ne peut pas être modifié');
  return d;
}

async function outilOrganiser(f) {
  occupe('Lecture des pages…');
  let pdf;
  try { pdf = await chargerPdfjs(f.octets); } finally { libre(); }
  const etat = Array.from({ length: pdf.numPages }, (_, i) => ({ src: i, rot: 0, choisie: false }));
  const fe = feuille({ titre: 'Organiser les pages', plein: true, surFermeture: () => pdf.destroy() });
  const grille = el('div', { class: 'vignettes' });
  const vignettes = new Map();
  const obs = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting) return; obs.unobserve(e.target);
    const k = +e.target.dataset.src, page = await pdf.getPage(k + 1);
    const vp1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 220 / Math.max(vp1.width, vp1.height) });
    const c = e.target.querySelector('canvas'); c.width = vp.width; c.height = vp.height;
    page.render({ canvasContext: c.getContext('2d'), viewport: vp, annotationMode: MODE_STOCK });
  }), { root: fe.corps, rootMargin: '200px' });
  const majGrille = () => {
    grille.replaceChildren(...etat.map((p, i) => {
      let v = vignettes.get(p.src);
      if (!v) { v = el('button', { type: 'button', class: 'vignette', dataset: { src: p.src } }, el('div', { class: 'cadre' }, el('canvas')), el('span', { class: 'num' }), el('span', { class: 'coche' }, icone('valider'))); vignettes.set(p.src, v); obs.observe(v); v.onclick = () => { const q = etat.find(x => x.src === p.src); q.choisie = !q.choisie; majGrille(); }; }
      v.classList.toggle('choisie', p.choisie);
      v.querySelector('canvas').style.transform = `rotate(${p.rot}deg)`;
      v.querySelector('.num').textContent = `Page ${i + 1}`;
      v.setAttribute('aria-pressed', p.choisie ? 'true' : 'false');
      return v;
    }));
    const n = etat.filter(p => p.choisie).length;
    compte.textContent = n ? `${n} page${n > 1 ? 's' : ''} sélectionnée${n > 1 ? 's' : ''}` : 'Touchez des pages pour les sélectionner.';
  };
  const choisies = () => { const c = etat.filter(p => p.choisie); if (!c.length) toast('Sélectionnez d\'abord une ou plusieurs pages.'); return c; };
  const deplacer = sens => {
    const idx = etat.map((p, i) => p.choisie ? i : -1).filter(i => i >= 0);
    if (!idx.length) return choisies();
    if (sens < 0 ? idx[0] === 0 : idx[idx.length - 1] === etat.length - 1) return;
    (sens < 0 ? idx : idx.reverse()).forEach(i => { [etat[i], etat[i + sens]] = [etat[i + sens], etat[i]]; });
    majGrille();
  };
  const compte = el('p', { class: 'note' });
  const construire = async (pages, suffixe) => {
    occupe('Création du PDF…');
    try {
      const src = await chargerPdfLib(f.octets), out = await PDFDocument.create(); out.setProducer('Atelier PDF');
      const copies = await out.copyPages(src, pages.map(p => p.src));
      copies.forEach((pg, k) => { pg.setRotation(degrees((angleDe(pg) + pages[k].rot) % 360)); out.addPage(pg); });
      const octets = await out.save();
      libre(); await fe.fermer();
      feuilleResultat(octets, nomSortie(f.nom, suffixe), `${pages.length} page${pages.length > 1 ? 's' : ''}`);
    } catch (e) { libre(); toast('Erreur : ' + e.message, 5000); }
  };
  fe.corps.append(compte, grille);
  const actions = el('div', { class: 'barre-actions' },
    bouton('Tout', { ico: 'pages', cls: 'outil', onclick: () => { const tout = etat.every(p => p.choisie); etat.forEach(p => p.choisie = !tout); majGrille(); } }),
    bouton('Pivoter', { ico: 'pivoter', cls: 'outil', onclick: () => { choisies().forEach(p => p.rot = (p.rot + 90) % 360); majGrille(); } }),
    bouton('Avant', { ico: 'gauche', cls: 'outil', onclick: () => deplacer(-1) }),
    bouton('Après', { ico: 'droite', cls: 'outil', onclick: () => deplacer(1) }),
    bouton('Supprimer', { ico: 'poubelle', cls: 'outil', onclick: () => {
      const c = choisies(); if (!c.length) return;
      if (c.length === etat.length) { toast('Impossible de supprimer toutes les pages.'); return; }
      c.forEach(p => etat.splice(etat.indexOf(p), 1)); majGrille();
    } }),
    bouton('Extraire', { ico: 'extraire', cls: 'outil', onclick: () => { const c = choisies(); if (c.length) construire(c, 'extrait'); } }));
  fe.pied.before(actions);
  fe.pied.append(bouton('Enregistrer le PDF', { ico: 'valider', cls: 'btn principal', onclick: () => construire(etat, 'organisé') }));
  majGrille();
}

function outilCompresser(f) {
  const niveaux = { forte: [96, 0.55, 'Forte : fichier très léger, qualité correcte à l\'écran'], moyenne: [130, 0.68, 'Moyenne : bon compromis (conseillé)'], legere: [170, 0.8, 'Légère : meilleure qualité, gain plus faible'] };
  let niveau = prefs.compression in niveaux ? prefs.compression : 'moyenne';
  const fe = feuille({ titre: 'Compresser' });
  fe.corps.append(
    el('p', {}, el('strong', { text: f.nom }), ' · ' + tailleLisible(f.octets.length)),
    el('div', { class: 'etiquette', text: 'Niveau' }),
    el('div', { class: 'menu-liste' }, segments('niveau', Object.entries(niveaux).map(([k, v]) => [k, v[2]]), niveau, v => { niveau = v; })),
    el('p', { class: 'note', text: 'Les pages sont transformées en images : le texte ne pourra plus être sélectionné ni recherché, et les champs de formulaire seront figés.' }));
  fe.pied.append(bouton('Compresser', { ico: 'compresser', cls: 'btn principal', onclick: async () => {
    const [dpi, q] = niveaux[niveau];
    occupe('Compression…');
    let pdf;
    try {
      pdf = await chargerPdfjs(f.octets);
      const out = await PDFDocument.create(); out.setProducer('Atelier PDF');
      for (let i = 1; i <= pdf.numPages; i++) {
        majOccupe(`Page ${i} / ${pdf.numPages}…`);
        const img = await pageEnImage(await pdf.getPage(i), dpi, q);
        const jpg = await out.embedJpg(img.octets);
        out.addPage([img.w, img.h]).drawImage(jpg, { x: 0, y: 0, width: img.w, height: img.h });
      }
      const octets = await out.save();

/* =========================================================
   12. PHOTOS → PDF ET EFFET SCANNER
   ========================================================= */
/** Transformation perspective : du carré unité vers un quadrilatère (méthode de Heckbert). */
function carreVersQuad(q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  let a, b, c, d, e, f, g, h;
  if (Math.abs(dx3) < 1e-9 && Math.abs(dy3) < 1e-9) { a = x1 - x0; b = x3 - x0; c = x0; d = y1 - y0; e = y3 - y0; f = y0; g = 0; h = 0; }
  else {
    const den = dx1 * dy2 - dx2 * dy1;
    g = (dx3 * dy2 - dx2 * dy3) / den; h = (dx1 * dy3 - dx3 * dy1) / den;
    a = x1 - x0 + g * x1; b = x3 - x0 + h * x3; c = x0; d = y1 - y0 + g * y1; e = y3 - y0 + h * y3; f = y0;
  }
  return (u, v) => { const w = g * u + h * v + 1; return [(a * u + b * v + c) / w, (d * u + e * v + f) / w]; };
}
/** Redresse la zone choisie (4 coins) en un rectangle bien droit. */
function redresser(src, coins) {
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  let W = Math.max(dist(coins[0], coins[1]), dist(coins[3], coins[2])), H = Math.max(dist(coins[0], coins[3]), dist(coins[1], coins[2]));
  const k = Math.min(1, 2200 / Math.max(W, H)); W = Math.round(W * k); H = Math.round(H * k);
  const sd = src.getContext('2d').getImageData(0, 0, src.width, src.height).data, sw = src.width, sh = src.height;
  const out = el('canvas'); out.width = W; out.height = H;
  const octx = out.getContext('2d'), im = octx.createImageData(W, H), d = im.data;
  const m = carreVersQuad(coins);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let [sx, sy] = m((x + 0.5) / W, (y + 0.5) / H);
    sx = clamp(sx - 0.5, 0, sw - 1.001); sy = clamp(sy - 0.5, 0, sh - 1.001);
    const ix = sx | 0, iy = sy | 0, fx = sx - ix, fy = sy - iy, o = (y * W + x) * 4;
    const p00 = (iy * sw + ix) * 4, p10 = p00 + 4, p01 = p00 + sw * 4, p11 = p01 + 4;
    for (let c = 0; c < 3; c++) d[o + c] = (sd[p00 + c] * (1 - fx) + sd[p10 + c] * fx) * (1 - fy) + (sd[p01 + c] * (1 - fx) + sd[p11 + c] * fx) * fy;
    d[o + 3] = 255;
  }
  octx.putImageData(im, 0, 0);
  return out;
}
/** Retire les ombres et blanchit le papier ; filtre : couleur, gris ou noir et blanc. */
function ameliorer(c, filtre) {
  if (filtre === 'original') return c;
  const W = c.width, H = c.height, ctx = c.getContext('2d'), im = ctx.getImageData(0, 0, W, H), d = im.data;
  // 1. Estimation du fond (le papier) : maximum local sur une petite grille, puis lissage
  const bloc = Math.max(8, Math.round(Math.max(W, H) / 60)), gw = Math.ceil(W / bloc), gh = Math.ceil(H / bloc);
  let g = new Float32Array(gw * gh);
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    const o = (y * W + x) * 4, L = (d[o] * 299 + d[o + 1] * 587 + d[o + 2] * 114) / 1000, k = ((y / bloc) | 0) * gw + ((x / bloc) | 0);
    if (L > g[k]) g[k] = L;
  }
  for (let passe = 0; passe < 3; passe++) {
    const n = new Float32Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      let s = 0, c2 = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const xx = x + i, yy = y + j; if (xx >= 0 && yy >= 0 && xx < gw && yy < gh) { s += g[yy * gw + xx]; c2++; } }
      n[y * gw + x] = s / c2;
    }
    g = n;
  }
  const fond = (x, y) => {
    const gx = clamp(x / bloc - 0.5, 0, gw - 1), gy = clamp(y / bloc - 0.5, 0, gh - 1), ix = Math.min(gx | 0, gw - 2 < 0 ? 0 : gw - 2), iy = Math.min(gy | 0, gh - 2 < 0 ? 0 : gh - 2);
    const fx = gw > 1 ? gx - ix : 0, fy = gh > 1 ? gy - iy : 0, a = g[iy * gw + ix], b = g[iy * gw + Math.min(ix + 1, gw - 1)], cc = g[Math.min(iy + 1, gh - 1) * gw + ix], dd = g[Math.min(iy + 1, gh - 1) * gw + Math.min(ix + 1, gw - 1)];
    return Math.max(40, (a * (1 - fx) + b * fx) * (1 - fy) + (cc * (1 - fx) + dd * fx) * fy);
  };
  // 2. Division par le fond : le papier devient blanc, les ombres disparaissent
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4, k = 255 / fond(x, y);
    let r = d[o] * k, v = d[o + 1] * k, b = d[o + 2] * k;
    if (filtre === 'couleur') {
      const f2 = t => clamp((t - 30) * 255 / 215, 0, 255);
      d[o] = f2(r); d[o + 1] = f2(v); d[o + 2] = f2(b);
    } else {
      const L = (r * 299 + v * 587 + b * 114) / 1000;
      const out = filtre === 'nb' ? clamp((L - 150) * 4 + 128, 0, 255) : clamp((L - 35) * 255 / 210, 0, 255);
      d[o] = d[o + 1] = d[o + 2] = out;
    }
  }
  ctx.putImageData(im, 0, 0);
  return c;
}
function pivoterCanvas(c, sens = 1) {
  const r = el('canvas'); r.width = c.height; r.height = c.width;
  const ctx = r.getContext('2d'); ctx.translate(r.width / 2, r.height / 2); ctx.rotate(sens * Math.PI / 2); ctx.drawImage(c, -c.width / 2, -c.height / 2);
  return r;
}

/** Éditeur « scanner » : 4 coins à placer, puis redressement et nettoyage. */
function editeurScanner(source) {
  return new Promise(res => {
    let resultat = null, src = source, filtre = 'couleur';
    let coins = [[0, 0], [src.width, 0], [src.width, src.height], [0, src.height]];
    const fe = feuille({ titre: 'Recadrer et nettoyer', plein: true, surFermeture: () => res(resultat) });
    const zone = el('div', { class: 'scan-zone' }), apercu = el('canvas');
    zone.append(apercu);
    const poignees = [0, 1, 2, 3].map(k => { const p = el('div', { class: 'coin', role: 'slider', 'aria-label': ['Coin haut gauche', 'Coin haut droit', 'Coin bas droit', 'Coin bas gauche'][k] }); zone.append(p); return p; });
    let ech = 1;
    const dessiner = () => {
      const max = Math.min(fe.corps.clientWidth - 36, 900), maxH = innerHeight * 0.55;
      ech = Math.min(max / src.width, maxH / src.height);
      const w = Math.round(src.width * ech), h = Math.round(src.height * ech);
      zone.style.width = w + 'px'; zone.style.height = h + 'px';
      apercu.width = w; apercu.height = h;
      const ctx = apercu.getContext('2d'); ctx.drawImage(src, 0, 0, w, h);
      ctx.fillStyle = 'rgba(13,107,79,.18)'; ctx.strokeStyle = '#0d6b4f'; ctx.lineWidth = 2;
      ctx.beginPath(); coins.forEach(([x, y], i) => i ? ctx.lineTo(x * ech, y * ech) : ctx.moveTo(x * ech, y * ech)); ctx.closePath(); ctx.fill(); ctx.stroke();
      poignees.forEach((p, k) => { p.style.left = coins[k][0] * ech + 'px'; p.style.top = coins[k][1] * ech + 'px'; });
    };
    poignees.forEach((p, k) => {
      p.addEventListener('pointerdown', e => {
        e.preventDefault(); p.setPointerCapture(e.pointerId);
        const mv = m => { const r = zone.getBoundingClientRect(); coins[k] = [clamp((m.clientX - r.left) / ech, 0, src.width), clamp((m.clientY - r.top) / ech, 0, src.height)]; dessiner(); };
        const fin = () => { p.removeEventListener('pointermove', mv); p.removeEventListener('pointerup', fin); p.removeEventListener('pointercancel', fin); };
        p.addEventListener('pointermove', mv); p.addEventListener('pointerup', fin); p.addEventListener('pointercancel', fin);
      });
    });
    const tourner = sens => {
      src = pivoterCanvas(src, sens);
      const W = src.width, H = src.height;
      coins = coins.map(([x, y]) => sens > 0 ? [H - y, x] : [y, W - x]);
      coins = sens > 0 ? [coins[3], coins[0], coins[1], coins[2]] : [coins[1], coins[2], coins[3], coins[0]];
      dessiner();
    };
    fe.corps.append(
      el('p', { class: 'note', text: 'Faites glisser les 4 ronds sur les coins de la feuille.' }), zone,
      el('div', { class: 'rangee-btn' },
        bouton('Gauche', { ico: 'pivoter-g', onclick: () => tourner(-1) }),
        bouton('Droite', { ico: 'pivoter', onclick: () => tourner(1) }),
        bouton('Tout', { ico: 'scanner', onclick: () => { coins = [[0, 0], [src.width, 0], [src.width, src.height], [0, src.height]]; dessiner(); } })),
      el('div', { class: 'etiquette', text: 'Rendu' }),
      segments('filtre', [['couleur', 'Couleur nette'], ['gris', 'Gris'], ['nb', 'Noir et blanc'], ['original', 'Photo d\'origine']], filtre, v => { filtre = v; }));
    fe.pied.append(
      bouton('Annuler', { onclick: () => fe.fermer() }),
      bouton('Valider', { ico: 'valider', cls: 'btn principal', onclick: async () => {
        occupe('Traitement de la photo…'); await attendre(30);
        try {
          const plein = coins.every(([x, y], k) => Math.abs(x - [0, src.width, src.width, 0][k]) < 2 && Math.abs(y - [0, 0, src.height, src.height][k]) < 2);
          let c = plein ? (() => { const r = el('canvas'); r.width = src.width; r.height = src.height; r.getContext('2d').drawImage(src, 0, 0); return r; })() : redresser(src, coins);
          resultat = ameliorer(c, filtre);
        } catch (e) { console.error(e); toast('Traitement impossible : ' + e.message); }
        finally { libre(); }
        fe.fermer();
      } }));
    requestAnimationFrame(() => requestAnimationFrame(dessiner));
  });
}

/* =========================================================
   13. FICHIERS REÇUS (menu Partager d'Android, « Ouvrir avec », glisser-déposer)
   ========================================================= */
async function traiterFichiers(fichiers) {
  fichiers = fichiers.filter(Boolean);
  if (!fichiers.length) return;
  const pdfs = fichiers.filter(estPdf), imgs = fichiers.filter(estImage);
  if (pdfs.length === 1 && !imgs.length) return ouvrirFichier(pdfs[0]);
  if (pdfs.length > 1 && !imgs.length) return outilFusion(await Promise.all(pdfs.map(lireFichier)));
  if (imgs.length && !pdfs.length) return outilPhotos({ fichiers: imgs });
  if (pdfs.length) return ouvrirFichier(pdfs[0]);
  toast('Ces fichiers ne sont pas pris en charge (PDF ou images uniquement).');
}
async function recupererPartage() {
  try {
    const cache = await caches.open('atelier-partage');
    const fichiers = [];
    for (const req of await cache.keys()) {
      const rep = await cache.match(req);
      const blob = await rep.blob();
      fichiers.push(new File([blob], decodeURIComponent(rep.headers.get('X-Nom') || 'document'), { type: blob.type }));
      await cache.delete(req);
    }
    history.replaceState(null, '', location.pathname);
    await traiterFichiers(fichiers);
  } catch (e) { console.error(e); toast('Impossible de récupérer le fichier partagé.'); }
}

/* =========================================================
   14. DÉMARRAGE
   ========================================================= */
$('#btn-ouvrir').addEventListener('click', async () => { const [f] = await choisirFichiers(); if (f) ouvrirFichier(f); });
$('#btn-scanner').addEventListener('click', () => outilPhotos({ camera: true }));
$('#btn-photos').addEventListener('click', async () => { const fs = await choisirFichiers({ accept: 'image/*', multiple: true }); if (fs.length) outilPhotos({ fichiers: fs }); });
$('#btn-param').addEventListener('click', ouvrirParametres);
$$('[data-outil]').forEach(b => b.addEventListener('click', () => lancerOutil(b.dataset.outil)));
$('#doc-retour').addEventListener('click', () => fermerCouche());
$('#doc-chercher').addEventListener('click', ouvrirRecherche);
$('#doc-menu').addEventListener('click', menuDocument);
$('#btn-editer').addEventListener('click', () => changerMode('editer'));
$('#btn-partager').addEventListener('click', () => exporter('partager'));
$('#btn-enregistrer').addEventListener('click', () => exporter('enregistrer'));
addEventListener('beforeunload', e => { if (D && D.modifie) { e.preventDefault(); e.returnValue = ''; } });

// Glisser-déposer (ordinateur)
let profondeurDepot = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { profondeurDepot++; $('#depot').classList.add('visible'); } });
addEventListener('dragleave', () => { if (--profondeurDepot <= 0) { profondeurDepot = 0; $('#depot').classList.remove('visible'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); profondeurDepot = 0; $('#depot').classList.remove('visible'); traiterFichiers([...(e.dataTransfer?.files || [])]); });

// « Ouvrir avec Atelier PDF » (appli installée sur ordinateur)
if ('launchQueue' in window) launchQueue.setConsumer(async p => { if (p.files?.length) traiterFichiers(await Promise.all(p.files.map(h => h.getFile()))); });
if (new URLSearchParams(location.search).has('partage')) recupererPartage();

// Fonctionnement hors ligne
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker non installé', e));
  let dejaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (dejaControle) toast('Nouvelle version installée : elle sera active à la prochaine ouverture.', 5000);
    dejaControle = true;
  });
}
</script>
